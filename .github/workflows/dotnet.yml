name: .NET CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OctaneTagWritingTest/OctaneTagWritingTest.sln

      - name: Build
        run: dotnet build OctaneTagWritingTest/OctaneTagWritingTest.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test OctaneTagWritingTest/OctaneTagWritingTest.sln --configuration Release --no-build --logger "trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/*.trx'
